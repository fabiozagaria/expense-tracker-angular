<app-header></app-header>

@if (router.currentNavigation()) {
  <div class="route-loading">
    <app-loading-spinner size="lg" [showLabel]="true" label="Caricamento pagina…" />
  </div>
}

<main class="workspace-main" [attr.aria-busy]="!!router.currentNavigation()">
  @if (navigationError()) {
    <p class="ui-panel" role="alert">
      Impossibile aprire la pagina. Riprova dal menu di navigazione.
    </p>
  }
  <app-maintenance-banner></app-maintenance-banner>
  @if (auth.isDemoSession()) {
    <div class="demo-notice" role="note">
      <span class="notice-badge"><i class="pi pi-circle-fill" aria-hidden="true"></i> DEMO</span>
      <p>
        Account condiviso: le modifiche sono visibili agli altri visitatori. Usa solo dati fittizi.
      </p>
      <i class="pi pi-info-circle notice-info" aria-hidden="true"></i>
    </div>
  }
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
