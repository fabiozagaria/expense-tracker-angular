<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-4">
            <span class="badge text-bg-primary mb-3">Area personale</span>
            <h1 class="h2 fw-bold">Accedi</h1>
            <p class="text-body-secondary mb-0">
              Inserisci i tuoi dati per entrare nel gestionale.
            </p>
          </div>

          <form>
            <div class="mb-3">
              <label class="form-label" for="login-email">Email</label>
              <input
                class="form-control form-control-lg"
                id="login-email"
                type="email"
                autocomplete="email"
                placeholder="nome@esempio.it"
                required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="login-password">Password</label>
              <input
                class="form-control form-control-lg"
                id="login-password"
                type="password"
                autocomplete="current-password"
                placeholder="Inserisci la password"
                required>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" id="remember-login" type="checkbox">
              <label class="form-check-label" for="remember-login">Ricordami</label>
            </div>

            <a class="btn btn-primary btn-lg w-100" [routerLink]="['/dashboard']">
              Accedi
            </a>
          </form>

          <hr class="my-4">

          <a class="btn btn-outline-secondary w-100" [routerLink]="['/']">
            Torna alla Home
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
