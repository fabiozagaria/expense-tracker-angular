<section class="container">
  <h2>Riepilogo Spese</h2>
  @if (loading()) { <p>Caricamento spese…</p> }
  @if (error()) { <p class="alert alert-danger" role="alert">{{ error() }}</p> }
  @for (expense of expenseList(); track expense.id) {
    <app-expense-card
    
    [expense]="expense"
    (onRemove)="removeExpense($event)"
    (onUpdate)="updateExpense($event)"
    ></app-expense-card>

  } @empty {
    @if (!loading() && !error()) { <p class="invalid-feedback d-block fs-2">
      Nessuna spesa aggiunta! 
    </p> }
  }
</section>
