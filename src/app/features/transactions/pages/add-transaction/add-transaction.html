<section class="container py-5">
  <div class="text-center mb-5">
    <span class="badge rounded-pill text-bg-primary mb-3">Nuovo movimento</span>
    <h1 class="display-6 fw-bold">Cosa vuoi aggiungere?</h1>
    <p class="lead text-body-secondary mb-0">
      Scegli il tipo di movimento per continuare.
    </p>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-12 col-md-6 col-xl-5">
      <article class="choice-card card h-100 border-danger-subtle shadow-sm">
        <div class="card-body d-flex flex-column p-4 p-lg-5">
          <span class="choice-symbol text-danger mb-3" aria-hidden="true">−</span>
          <h2 class="card-title h3">Aggiungi una spesa</h2>
          <p class="card-text text-body-secondary flex-grow-1">
            Registra un acquisto, una bolletta o un'altra uscita.
          </p>
          <a class="btn btn-danger btn-lg w-100" [routerLink]="['/add-expense']">
            Continua con la spesa
          </a>
        </div>
      </article>
    </div>

    <div class="col-12 col-md-6 col-xl-5">
      <article class="choice-card card h-100 border-success-subtle shadow-sm">
        <div class="card-body d-flex flex-column p-4 p-lg-5">
          <span class="choice-symbol text-success mb-3" aria-hidden="true">+</span>
          <h2 class="card-title h3">Aggiungi un'entrata</h2>
          <p class="card-text text-body-secondary flex-grow-1">
            Registra uno stipendio, un rimborso o un'altra entrata.
          </p>
          <a class="btn btn-success btn-lg w-100" [routerLink]="['/add-income']">
            Continua con l'entrata
          </a>
        </div>
      </article>
    </div>
  </div>
</section>
