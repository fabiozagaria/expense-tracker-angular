<section class="container">
  <div>
    <form
          [formGroup]="incomeForm"
          class="d-flex flex-column
          justify-content-between gap-2 p-2 m-2
          align-items-center w-75">
          
      <div class="form-control w-50 m-3">
        <label 
        for="income"
        class="form-label m-2">
        Entrata (Stipendio ecc):
        </label>
      <input 
      formControlName="income"
      class="form-control m-2"
      type="number" 
      id="income"
      step="0.01"
      placeholder="Inserisci una entrata"
      >

      
      </div>
    </form>
  </div>
</section>
